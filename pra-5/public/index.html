
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>Task Manager</h1>
        </header>

        <section class="task-form">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter task title"
                        required
                    >

                </div>
                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Enter task description"
                    ></textarea>

                </div>

                <div class="checkbox-group">

                    <label>

                        <input
                            type="checkbox"
                            id="completed"
                        >

                        Completed

                    </label>

                </div>
                <br><br>
                <button
                    type="submit"
                    class="add-btn"
                >
                    Add Task
                </button>

            </form>

        </section>

        <section class="tasks-section">

            <div class="tasks-header">

                <div>

                    <h2>My Tasks</h2>

                    <span id="taskCount">
                        0 tasks
                    </span>

                </div>


                <button
                    onclick="loadTasks()"
                    class="refresh-btn"
                >
                    Refresh
                </button>

            </div>

            <div id="message"></div>


            <div id="taskList"></div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
